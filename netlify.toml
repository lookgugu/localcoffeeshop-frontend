[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_ENV = "production"
  # Set in Netlify dashboard:
  # API_BASE_URL = "https://api.localcoffeeshop.co/api/v1"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# Cache static assets
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA-like routing - serve appropriate HTML for unknown paths
[[redirects]]
  from = "/states/*"
  to = "/html/state.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/html/index.html"
  status = 200
  force = false
