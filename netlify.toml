[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_ENV = "production"
  # Set in Netlify dashboard:
  # API_BASE_URL = "https://api.localcoffeeshop.co/api/v1"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # NOTE: script-src keeps 'unsafe-inline' because index.html/state.html embed
    # inline gtag/consent bootstrap scripts. Everything else is locked down.
    # X-XSS-Protection is intentionally omitted (deprecated; superseded by CSP).
    # This header applies to /*, so it must also allow the third-party assets the
    # static state/shop pages already use: Leaflet (unpkg.com), Font Awesome
    # (cdnjs.cloudflare.com), Unsplash images, and OpenStreetMap map tiles.
    # unpkg is path-scoped to the pinned Leaflet version (not the whole origin,
    # which hosts arbitrary npm packages and would be a CSP-bypass surface).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://unpkg.com/leaflet@1.7.1/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com/leaflet@1.7.1/ https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://i.pravatar.cc https://images.unsplash.com https://unpkg.com/leaflet@1.7.1/ https://*.tile.openstreetmap.org https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://api.localcoffeeshop.co https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

# Cache static assets
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# State deep-links render the (client-hydrated) state page.
[[redirects]]
  from = "/states/*"
  to = "/html/state.html"
  status = 200

# Extensionless in-site nav links (used across the static pages) map to the
# real files. These must precede the catch-all, otherwise the new 404 turns
# these existing navigations into hard 404s.
[[redirects]]
  from = "/pages/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/pages/contact"
  to = "/pages/contact.html"
  status = 301

[[redirects]]
  from = "/pages/states"
  to = "/pages/states/"
  status = 301

# Unknown paths return a real 404 (not a 200 homepage) so search engines don't
# index infinite duplicates of the homepage as soft-404s. force = false lets
# real files (/, /about.html, /pages/*, /sitemap.xml, …) be served first.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
