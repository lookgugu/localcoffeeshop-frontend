<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="metaDescription" content="Find local coffee shops. Browse cafes by price level and location.">
    <meta name="keywords" content="coffee shops, local coffee, cafes, coffee near me">
    <meta name="robots" content="index, follow">
    <title>Coffee Shops - Loading...</title>

    <!-- Canonical URL - updated by JavaScript -->
    <link rel="canonical" id="canonicalUrl" href="https://localcoffeeshop.co/html/state.html">

    <!-- Open Graph / Facebook - updated by JavaScript -->
    <meta property="og:type" content="website">
    <meta property="og:url" id="ogUrl" content="https://localcoffeeshop.co/html/state.html">
    <meta property="og:title" id="ogTitle" content="Coffee Shops">
    <meta property="og:description" id="ogDescription" content="Find local coffee shops. Browse cafes by price level and location.">
    <meta property="og:site_name" content="Local Coffee Shops">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" id="twitterTitle" content="Coffee Shops">
    <meta name="twitter:description" id="twitterDescription" content="Find local coffee shops. Browse cafes by price level and location.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Configuration (generated at build time) -->
    <script src="/config.js"></script>

    <!-- Asset loader handles CSS and JS paths for production/development -->
    <script src="/asset-loader-state.js"></script>
</head>
<body>
    <div class="container">
        <a href="/" class="back-button">← Back to States</a>
        <h1 id="pageTitle">Loading...</h1>
        <div class="state-info">
            <p>Total Coffee Shops: <span id="totalShops">Loading...</span></p>
            <p>Average Price Level: <span id="avgPrice">Loading...</span></p>
        </div>
        <ul class="coffee-list" id="coffeeList">
            <!-- Coffee shops will be populated by JavaScript -->
        </ul>
    </div>
</body>
</html>
