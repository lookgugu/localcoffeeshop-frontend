<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://*.google.com; connect-src 'self' https://api.localcoffeeshop.co http://localhost:3000 https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net https://*.google.com https://pagead2.googlesyndication.com; frame-src 'self' https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Warm up the cross-origin API + analytics connections before the app
         fetches this state's shops (the LCP element). -->
    <link rel="preconnect" href="https://api.localcoffeeshop.co" crossorigin>
    <link rel="dns-prefetch" href="https://api.localcoffeeshop.co">
    <link rel="preconnect" href="https://www.googletagmanager.com">

    <meta name="description" id="metaDescription" content="Find local coffee shops. Browse cafes by price level and location.">
    <meta name="keywords" content="coffee shops, local coffee, cafes, coffee near me">
    <meta name="robots" content="index, follow">
    <title>Coffee Shops - Loading...</title>

    <!-- Canonical URL - updated by JavaScript -->
    <link rel="canonical" id="canonicalUrl" href="https://localcoffeeshop.co/html/state.html">

    <!-- Open Graph / Facebook - updated by JavaScript -->
    <meta property="og:type" content="website">
    <meta property="og:url" id="ogUrl" content="https://localcoffeeshop.co/html/state.html">
    <meta property="og:title" id="ogTitle" content="Coffee Shops">
    <meta property="og:description" id="ogDescription" content="Find local coffee shops. Browse cafes by price level and location.">
    <meta property="og:site_name" content="Local Coffee Shops">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" id="twitterTitle" content="Coffee Shops">
    <meta name="twitter:description" id="twitterDescription" content="Find local coffee shops. Browse cafes by price level and location.">

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#2C3E50">
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="stylesheet" href="/dist/styles.min.css">

    <!-- Configuration (generated at build time) -->
    <script src="/config.js"></script>

    <!-- Order is load-bearing: the consent default is queued first, then
         url-privacy.js scrubs the address bar, then analytics-init.js
         configures the tag with sanitised page_location / page_referrer (and
         does not configure it at all if that helper is unavailable). -->
    <script src="/geo-consent-default.js"></script>
    <script src="/url-privacy.js"></script>
    <script src="/analytics-init.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YVSXN7PM48"></script>

    <!-- Page JS: declared in markup so the preload scanner fetches it in
         parallel; defer keeps it off the critical rendering path and runs it
         in this order after parsing. /dist/state.bundle.min.js bundles the page code
         with its deps (scripts/build-js.cjs). -->
    <script defer src="/consent-banner.js"></script>
    <script defer src="/dist/state.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <a href="/" class="back-button">← Back to States</a>
        <h1 id="pageTitle">Loading...</h1>
        <div class="state-info">
            <p>Total Coffee Shops: <span id="totalShops">Loading...</span></p>
            <p>Average Price Level: <span id="avgPrice">Loading...</span></p>
        </div>
        <p class="coverage-notice" role="note">This directory is not exhaustive, and details like hours, addresses and websites can change. Please check with the shop before you visit. Spot something wrong or missing? <a href="/submit.html">Suggest a correction</a>.</p>
        <ul class="coffee-list" id="coffeeList">
            <!-- Coffee shops will be populated by JavaScript -->
        </ul>
    </div>
</body>
</html>
