name: Production smoke check
# GET-only check of https://localcoffeeshop.co and the API contract
# (scripts/smoke-check.cjs): ~7 requests, 3 of them to the API. Silent on
# success; the job fails with one line per problem otherwise.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies needed: the script uses only Node built-ins.
      - run: npm run smoke
