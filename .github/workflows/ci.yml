name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      # NODE_ENV and API_BASE_URL are unset, so this is a local build: the
      # state prerender skips instead of calling the rate-limited API (#24).
      - run: npm run build
